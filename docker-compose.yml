version: '3.8'

services:
  assets-cdn:
    image: nginx:alpine
    container_name: merim-assets-cdn
    restart: always
    volumes:
      # Data directory on persistent volume (or local ./data if running locally)
      - ${ASSETS_DATA_PATH:-/mnt/volume-fsn1-1/assets-cdn/data}:/usr/share/nginx/html:ro
      # Custom Nginx configuration
      - ${ASSETS_CONF_PATH:-/mnt/volume-fsn1-1/assets-cdn/nginx.conf}:/etc/nginx/conf.d/default.conf:ro
    ports:
      # If running standalone without Coolify Traefik, expose on 80/443.
      # If running in Coolify, Coolify Traefik handles the port mapping.
      - "8085:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
