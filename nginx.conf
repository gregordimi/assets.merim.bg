server {
    listen 80;
    server_name assets.merim.bg localhost;
    root /usr/share/nginx/html;

    # Basic performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Security: hide nginx version
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Universal CORS headers for all asset requests
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;

    # Handle preflight OPTIONS requests
    if ($request_method = OPTIONS) {
        return 204;
    }

    # Static images & media (Aggressive 1-year immutable edge/browser caching)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        log_not_found off;
        try_files $uri =404;
    }

    # Fonts
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        try_files $uri =404;
    }

    # Default fallback - return 404 (NEVER fall back to index.html on CDN)
    location / {
        try_files $uri =404;
    }

    # Health check endpoint
    location = /healthz {
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
